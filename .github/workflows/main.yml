name: Daily Article Publisher

on:
  schedule:
    - cron: '0 1 * * *'  # 每天 UTC 1:00 (台灣時間 9:00)
      workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run article publisher
        env:
          G_SYSTEM_API_URL: ${{ secrets.G_SYSTEM_API_URL }}
          G_SYSTEM_API_KEY: ${{ secrets.G_SYSTEM_API_KEY }}
        run: python daily_article_workflow.py
